# EduCenter — production stack, served to the internet through Tailscale Funnel.
#
#   internet -> Tailscale Funnel (TLS) -> 127.0.0.1:8088 -> gateway -> api / web -> db
#
# What is reachable from where:
#   * gateway  the ONLY published port, bound to this machine's loopback. Funnel connects to it; nothing else can.
#   * api, web on the internal `backend` network only. The API also joins `edge` — the one network with a way out —
#              because the AI providers are called over the internet.
#   * db       on `backend` only: no published port, no route to the internet. Not even the API's host can `psql` to it
#              except through `docker compose exec`.
#
# Secrets come from deploy/.env (git-ignored, generated by scripts/deploy.sh) — none are written in this file.
name: educenter-prod

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Postgres's entrypoint needs a few capabilities to prepare its data directory and drop to the postgres user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?run deploy/scripts/deploy.sh to generate deploy/.env}
      APP_DB_NAME: ${APP_DB_NAME:-educenter}
      APP_DB_USER: ${APP_DB_USER:-educenter_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run deploy/scripts/deploy.sh to generate deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    <<: *hardening
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
    image: educenter-api:prod
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, edge]
    # The AI models run on this machine (Ollama, Whisper) and are reached through the host, not by joining the
    # development compose network — that network also holds the development database.
    extra_hosts: ["host.docker.internal:host-gateway"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - appdata:/app/App_Data
    mem_limit: 1536m
    pids_limit: 512
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The public name (Funnel) plus "localhost" for the container's own healthcheck. `*` is refused at startup.
      AllowedHosts: "${PUBLIC_HOST:?};localhost"
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${APP_DB_NAME:-educenter};Username=${APP_DB_USER:-educenter_app};Password=${APP_DB_PASSWORD};Maximum Pool Size=40
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?run deploy/scripts/deploy.sh to generate deploy/.env}

      # Behind the gateway: plain HTTP in, X-Forwarded-For believed only from the docker networks' private ranges.
      Deployment__BehindTlsProxy: "true"
      Deployment__TrustedProxyNetworks__0: 10.0.0.0/8
      Deployment__TrustedProxyNetworks__1: 172.16.0.0/12
      Deployment__TrustedProxyNetworks__2: 192.168.0.0/16

      # First start on an empty database: migrate, load roles/permissions, then either create one organization with its
      # owner (Clean) or load the demo centre with a secret shared password (Demo). See docs/22_deploy_internet.md §3.
      Database__MigrateOnStartup: "true"
      Bootstrap__Mode: ${BOOTSTRAP_MODE:-Clean}
      Bootstrap__DemoPassword: ${DEMO_PASSWORD:-}
      Bootstrap__OrganizationName: ${BOOTSTRAP_ORG_NAME:-EduCenter}
      Bootstrap__TenantSlug: ${BOOTSTRAP_ORG_SLUG:-educenter}
      Bootstrap__SuperAdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-admin@educenter.local}
      Bootstrap__SuperAdminFullName: ${BOOTSTRAP_ADMIN_NAME:-Super Admin}
      Bootstrap__SuperAdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}

      # Per-address limits are shared by everyone behind one address — a whole school is one NAT. Generous per address,
      # because each account is protected separately (lockout after repeated wrong passwords, per-user AI limit).
      RateLimiting__GlobalPermitPerMinute: "1200"
      RateLimiting__LoginPermitPerMinute: "30"
      RateLimiting__AiPermitPerMinute: "20"

      # AI. DeepSeek is the paid provider; the local models run in the development compose stack on this machine.
      Ai__Providers__deepseek__Enabled: ${DEEPSEEK_ENABLED:-false}
      Ai__Providers__deepseek__ApiKey: ${DEEPSEEK_API_KEY:-}
      Ai__Providers__local__Enabled: ${AI_LOCAL_ENABLED:-true}
      Ai__Providers__local__Type: Ollama
      Ai__Providers__local__BaseUrl: http://host.docker.internal:11434
      Ai__Providers__local__ChatModel: qwen3:8b
      Ai__Providers__local__EmbeddingModel: bge-m3
      Ai__Providers__local__DisableReasoning: "true"
      Ai__Providers__local__TimeoutSeconds: "180"
      Ai__Providers__whisper__Enabled: ${AI_LOCAL_ENABLED:-true}
      Ai__Providers__whisper__Type: WhisperAsr
      Ai__Providers__whisper__BaseUrl: http://host.docker.internal:19000
      Ai__Providers__whisper__TimeoutSeconds: "180"

      # Every uploaded file is scanned for malware before it is stored (docs/21.09-audit-jurnali S08.03), by clamd in the `clamav` service.
      # Required stays true: while clamd is down or still loading its signatures, uploads are refused — never stored unchecked.
      Files__Scanner__Provider: clamav
      Files__Scanner__Host: clamav
      Files__Scanner__Required: "true"

      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
    healthcheck:
      test: ["CMD", "dotnet", "EduCenter.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Virus scanner for uploads. clamd answers the API on 3310 (INSTREAM); freshclam keeps the signature database current, which is why it also
  # joins `edge` — the one network with a way out. It is not read-only and keeps its capabilities: the image's entrypoint prepares
  # its own directories and drops to the clamav user, and it is the one service here whose job is to open hostile files. The database
  # (~300 MB) lives in a volume, so a restart does not download it again; the first start takes a minute or two, and until clamd
  # is healthy the API refuses uploads.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [backend, edge]
    volumes:
      - clamdb:/var/lib/clamav
    mem_limit: 3g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  web:
    <<: *hardening
    build:
      context: ../frontend
      dockerfile: ../deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    image: educenter-web:prod
    depends_on:
      api: { condition: service_healthy }
    networks: [backend]
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=128m,uid=1000,gid=1000
    mem_limit: 512m
    pids_limit: 256
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/favicon.ico || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  gateway:
    <<: *hardening
    image: caddy:2-alpine
    # The caddy binary carries the file capability cap_net_bind_service; with every capability dropped the kernel
    # refuses to exec it at all. It listens on 8080 and never binds a privileged port, but the binary needs the bit.
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    networks: [backend, edge]
    ports:
      # Loopback only. `tailscale funnel` points here; the LAN and the tailnet cannot reach this port directly.
      - "127.0.0.1:${GATEWAY_PORT:-8088}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:size=16m
      - /config:size=16m
    mem_limit: 256m
    pids_limit: 256
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/gateway-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  # No route to the internet: db and web cannot call out, whatever runs in them.
  backend:
    internal: true
  # The way out (AI providers) and the way in (the published gateway port).
  edge: {}

volumes:
  pgdata:
  appdata:
  clamdb:
